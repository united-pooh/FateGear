module_id: generic_mvp
title: 通用MVP测试模组
version: 1
entry_scene_id: foyer
entry_stage_id: setup

flags:
  - key_found
  - door_unlocked
  - machine_primed
  - alarm_triggered
  - exit_open

scenes:
  - id: foyer
    name: 前厅
    description: 一间昏暗的前厅，通往储藏室和控制室的门都在眼前。
    tags: [entry]
  - id: storage
    name: 储藏室
    description: 这里堆满箱子和备用工具。
  - id: control
    name: 控制室
    description: 中央终端仍在低声运转。
  - id: exit
    name: 出口
    description: 打开的安全门通向外部。
    tags: [exit]

links:
  - id: foyer_to_storage
    from_scene_id: foyer
    to_scene_id: storage
  - id: storage_to_foyer
    from_scene_id: storage
    to_scene_id: foyer
  - id: foyer_to_control
    from_scene_id: foyer
    to_scene_id: control
    required_flags: [door_unlocked]
    required_stages: [access_opened, system_primed]
    block_reason: 控制室大门仍然上锁。
  - id: control_to_foyer
    from_scene_id: control
    to_scene_id: foyer
  - id: control_to_exit
    from_scene_id: control
    to_scene_id: exit
    required_flags: [exit_open]
    required_stages: [system_primed]
    block_reason: 安全门尚未打开。
  - id: exit_to_control
    from_scene_id: exit
    to_scene_id: control

actions:
  - id: find_key
    scene_id: storage
    name: 搜索钥匙
    kind: search
    once: true
    check:
      skill_key: spot_hidden
      difficulty: regular
      failure_reason: 你没有在杂物中找到任何钥匙线索。
    effects_on_success:
      - type: set_flag
        flag: key_found

  - id: unlock_control_door
    scene_id: storage
    name: 解锁控制室
    kind: operate
    once: true
    required_stages: [setup]
    check:
      skill_key: art_craft:locksmith
      difficulty: hard
      failure_reason: 锁芯结构太复杂，暂时无法解开。
    conditions:
      - type: flag_set
        flag: key_found
    effects_on_success:
      - type: set_flag
        flag: door_unlocked
    marks_scene_cleared: true

  - id: prime_machine
    scene_id: control
    name: 启动终端
    kind: operate
    once: true
    required_stages: [access_opened]
    check:
      skill_key: science:physics
      difficulty: regular
      failure_reason: 终端参数校准失败，机器没有响应。
    effects_on_success:
      - type: set_flag
        flag: machine_primed
      - type: advance_clock
        clock_id: alarm
        value: 1

  - id: open_exit
    scene_id: control
    name: 打开安全门
    kind: operate
    once: true
    required_stages: [system_primed]
    check:
      skill_key: science:physics
      difficulty: hard
      failure_reason: 安全门控制逻辑异常，开门请求被拒绝。
    conditions:
      - type: flag_set
        flag: machine_primed
    effects_on_success:
      - type: set_flag
        flag: exit_open

clocks:
  - id: alarm
    start: 0
    max_value: 3
    step_per_turn: 0
    threshold_events:
      - value: 1
        effects:
          - type: set_flag
            flag: alarm_triggered

story_stages:
  - id: setup
    name: 初始阶段
    description: 调查员刚进入设施探索。
  - id: access_opened
    name: 通路已开放
    description: 通往控制室的路径已经打通。
    required_flags: [door_unlocked]
  - id: system_primed
    name: 系统已启动
    description: 终端启动完毕，安全门可以开启。
    required_flags: [machine_primed]
  - id: escaped
    name: 成功脱出
    description: 调查员成功逃离设施。
    required_flags: [exit_open]
    is_terminal: true
    terminal_type: success

story_transitions:
  - id: unlock_access
    source_stage_id: setup
    target_stage_id: access_opened
    required_flags: [door_unlocked]
    trigger_type: action_succeeded
    trigger_value: unlock_control_door
    priority: 10
  - id: prime_system
    source_stage_id: access_opened
    target_stage_id: system_primed
    required_flags: [machine_primed]
    trigger_type: action_succeeded
    trigger_value: prime_machine
    priority: 10
  - id: escape_facility
    source_stage_id: system_primed
    target_stage_id: escaped
    required_flags: [exit_open]
    trigger_type: scene_entered
    trigger_value: exit
    priority: 10

endings:
  - id: escaped
    scene_id: exit
    conditions:
      - type: flag_set
        flag: exit_open
    result: 调查员成功逃离设施。
