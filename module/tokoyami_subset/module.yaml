module_id: tokoyami_subset
title: 常暗之厢最小验证模组
version: 1
entry_scene_id: car_6
entry_stage_id: awake

narrative_context:
  worldview_brief: 常暗列车像被遗忘在现实背面的末班车，车厢越向前越接近出口，也越接近列车真正的饥饿。
  max_lore_entries: 4
  max_context_chars: 2200
  npcs:
    - id: attendant
      name: 昏迷的乘务员
      role: 线索保管者
      public_description: 她倒在座椅边，制服胸牌被划花，指尖还攥着半截车票。
      persona: 刚苏醒时会先确认调查员是否仍是人类，然后才肯说出列车前方的事。
      speaking_style: 声音很轻，句尾常被车轮声吞掉。
      goals:
        - 引导调查员找到驾驶室钥匙。
        - 避免让循声者听见完整的人声。
      knowledge_boundary: 她知道钥匙曾被藏进3号车厢的行李堆，但不知道驾驶室之后会发生什么。
      secrets:
        - 她曾经拉下制动杆，导致上一批乘客被黑暗吞没。
      active_scene_ids: [car_4]
      active_stage_ids: [awake, informed]
  lorebook_entries:
    - id: note_warning
      title: 门上便签
      content: 便签的字迹像是仓促写下的求生规则：不要回头数车厢，听见后方咀嚼声时继续向前。
      scope_scene_ids: [car_6]
      scope_action_ids: [inspect_note]
      priority: 300
      insertion_order: 10
    - id: clicker_hunting_rule
      title: 循声者的狩猎方式
      content: 循声者不会追逐光，它追逐完整的人声、急促的脚步和金属撞击后的回音。
      keywords: [循声者, 喘息, 潜行]
      scope_scene_ids: [car_2]
      priority: 260
      insertion_order: 20
    - id: rear_threat_texture
      title: 后方威胁的质感
      content: 后方的大嘴不会立刻出现；它先让座椅缝隙渗出温热腥气，再让车厢连接处响起湿润的咀嚼声。
      scope_stage_ids: [informed, key_ready, breakthrough]
      priority: 180
      insertion_order: 30
      visibility: keeper
  safety_boundaries:
    - id: body_horror_limit
      severity: warning
      note: 可以保持克制的身体恐怖，但避免过度细化现实创伤过程。
  atmosphere:
    tone: 密闭、潮湿、追赶感逐步逼近。
    sensory_palette: [铁轨震颤, 冷白灯, 旧布座椅的潮味, 远处咀嚼声]
    pacing_hint: 每次成功都应打开一小段路，同时让后方威胁更近。
    tension_axis: 出口的希望与后方吞噬感同步增强。
    escalation_rules:
      - rear_threat 时钟上升后，优先描写声音和气味逼近，而不是直接展示怪物。
    forbidden_reveals:
      - 不要提前说明列车的真实来源。
    style_rules:
      - 先给调查员可观察的物，再给异常的解释。
      - 线索要能被玩家复述，恐怖感不能遮蔽行动目标。
  prose_controls:
    paragraph_limit: 3
    horror_intensity: 4
    dice_visibility: summarize
    style_rules:
      - 使用简洁中文，避免华丽堆砌。
      - 保持 KP 口吻，不替玩家做心理决定。

flags:
  - note_read
  - key_hint_known
  - attendant_revived
  - key_obtained
  - path_through_clickers
  - chose_accelerate
  - chose_decelerate
  - rear_threat_warning
  - rear_threat_overwhelms

scenes:
  - id: car_6
    name: 6号车厢
    description: 末班车的起始车厢，门上贴着便签。
    tags: [entry]
  - id: car_4
    name: 4号车厢
    description: 倒下的乘务员正躺在座椅边上。
  - id: car_3
    name: 3号车厢
    description: 杂乱的行李占满了车厢过道。
  - id: car_2
    name: 2号车厢
    description: 黑暗中传来循声者的喘息声。
  - id: head_car
    name: 先头车厢
    description: 驾驶室就在尽头。
    tags: [exit]

links:
  - id: car_6_to_4
    from_scene_id: car_6
    to_scene_id: car_4
  - id: car_4_to_6
    from_scene_id: car_4
    to_scene_id: car_6
  - id: car_4_to_3
    from_scene_id: car_4
    to_scene_id: car_3
  - id: car_3_to_4
    from_scene_id: car_3
    to_scene_id: car_4
  - id: car_3_to_2
    from_scene_id: car_3
    to_scene_id: car_2
  - id: car_2_to_3
    from_scene_id: car_2
    to_scene_id: car_3
  - id: car_2_to_head
    from_scene_id: car_2
    to_scene_id: head_car
    required_flags: [path_through_clickers]
    required_stages: [breakthrough]
    block_reason: 你还没有安全穿过循声者所在的车厢。
  - id: head_to_2
    from_scene_id: head_car
    to_scene_id: car_2

actions:
  - id: inspect_note
    scene_id: car_6
    name: 查看便签
    kind: investigate
    once: true
    required_stages: [awake]
    effects_on_success:
      - type: set_flag
        flag: note_read
      - type: set_flag
        flag: key_hint_known

  - id: revive_attendant
    scene_id: car_4
    name: 救醒乘务员
    kind: assist
    once: true
    effects_on_success:
      - type: set_flag
        flag: attendant_revived

  - id: find_key
    scene_id: car_3
    name: 寻找钥匙
    kind: search
    once: true
    required_stages: [informed]
    conditions:
      - type: flag_set
        flag: attendant_revived
    effects_on_success:
      - type: set_flag
        flag: key_obtained

  - id: sneak_past_clickers
    scene_id: car_2
    name: 潜行通过
    kind: stealth
    once: true
    required_stages: [key_ready]
    conditions:
      - type: flag_set
        flag: key_obtained
    effects_on_success:
      - type: set_flag
        flag: path_through_clickers
    marks_scene_cleared: true

  - id: accelerate_train
    scene_id: head_car
    name: 全速前进
    kind: operate
    once: true
    required_stages: [breakthrough]
    conditions:
      - type: flag_set
        flag: key_obtained
      - type: flag_set
        flag: path_through_clickers
    effects_on_success:
      - type: set_flag
        flag: chose_accelerate

  - id: brake_train
    scene_id: head_car
    name: 拉下制动杆
    kind: operate
    once: true
    required_stages: [breakthrough]
    conditions:
      - type: flag_set
        flag: key_obtained
      - type: flag_set
        flag: path_through_clickers
    effects_on_success:
      - type: set_flag
        flag: chose_decelerate

clocks:
  - id: rear_threat
    start: 0
    max_value: 10
    step_per_turn: 1
    threshold_events:
      - value: 2
        effects:
          - type: set_flag
            flag: rear_threat_warning
      - value: 10
        effects:
          - type: set_flag
            flag: rear_threat_overwhelms

story_stages:
  - id: awake
    name: 惊醒
    description: 调查员在诡异列车中醒来。
  - id: informed
    name: 掌握线索
    description: 调查员已意识到必须继续向前并寻找钥匙。
    required_flags: [note_read]
  - id: key_ready
    name: 钥匙到手
    description: 调查员已经找到了驾驶室钥匙。
    required_flags: [key_obtained]
  - id: breakthrough
    name: 突破障碍
    description: 调查员安全穿过了循声者所在的车厢。
    required_flags: [path_through_clickers]
  - id: true_end
    name: 真结局
    description: 电车冲破噩梦般的黑暗，众人回到了现实。
    required_flags: [chose_accelerate]
    is_terminal: true
    terminal_type: success
  - id: bad_end
    name: 坏结局
    description: 列车减速后陷入黑暗，大嘴在近处咀嚼。
    is_terminal: true
    terminal_type: failure

story_transitions:
  - id: awaken_to_informed
    source_stage_id: awake
    target_stage_id: informed
    required_flags: [note_read]
    trigger_type: action_succeeded
    trigger_value: inspect_note
    priority: 10
  - id: informed_to_key_ready
    source_stage_id: informed
    target_stage_id: key_ready
    required_flags: [key_obtained]
    trigger_type: action_succeeded
    trigger_value: find_key
    priority: 10
  - id: key_ready_to_breakthrough
    source_stage_id: key_ready
    target_stage_id: breakthrough
    required_flags: [path_through_clickers]
    trigger_type: action_succeeded
    trigger_value: sneak_past_clickers
    priority: 10
  - id: breakthrough_to_true_end
    source_stage_id: breakthrough
    target_stage_id: true_end
    required_flags: [chose_accelerate]
    trigger_type: action_succeeded
    trigger_value: accelerate_train
    priority: 10
  - id: breakthrough_to_bad_end
    source_stage_id: breakthrough
    target_stage_id: bad_end
    required_flags: [chose_decelerate]
    trigger_type: action_succeeded
    trigger_value: brake_train
    priority: 20
  - id: informed_overwhelmed
    source_stage_id: informed
    target_stage_id: bad_end
    required_flags: [rear_threat_overwhelms]
    trigger_type: clock_threshold_triggered
    trigger_value: rear_threat:10
    priority: 0
  - id: key_ready_overwhelmed
    source_stage_id: key_ready
    target_stage_id: bad_end
    required_flags: [rear_threat_overwhelms]
    trigger_type: clock_threshold_triggered
    trigger_value: rear_threat:10
    priority: 0
  - id: breakthrough_overwhelmed
    source_stage_id: breakthrough
    target_stage_id: bad_end
    required_flags: [rear_threat_overwhelms]
    trigger_type: clock_threshold_triggered
    trigger_value: rear_threat:10
    priority: 0

endings:
  - id: true_end
    scene_id: head_car
    conditions:
      - type: flag_set
        flag: chose_accelerate
    result: 电车冲破噩梦般的黑暗，众人回到了现实。
  - id: bad_end
    scene_id: head_car
    conditions:
      - type: flag_set
        flag: chose_decelerate
    result: 列车减速后陷入黑暗，大嘴在近处咀嚼。
