module_id: tokoyami_subset
title: 常暗之厢最小验证模组
version: 1
entry_scene_id: car_6
entry_stage_id: awake

flags:
  - note_read
  - key_hint_known
  - attendant_revived
  - key_obtained
  - path_through_clickers
  - chose_accelerate
  - chose_decelerate
  - rear_threat_warning
  - rear_threat_overwhelms

scenes:
  - id: car_6
    name: 6号车厢
    description: 末班车的起始车厢，门上贴着便签。
    tags: [entry]
  - id: car_4
    name: 4号车厢
    description: 倒下的乘务员正躺在座椅边上。
  - id: car_3
    name: 3号车厢
    description: 杂乱的行李占满了车厢过道。
  - id: car_2
    name: 2号车厢
    description: 黑暗中传来循声者的喘息声。
  - id: head_car
    name: 先头车厢
    description: 驾驶室就在尽头。
    tags: [exit]

links:
  - id: car_6_to_4
    from_scene_id: car_6
    to_scene_id: car_4
  - id: car_4_to_6
    from_scene_id: car_4
    to_scene_id: car_6
  - id: car_4_to_3
    from_scene_id: car_4
    to_scene_id: car_3
  - id: car_3_to_4
    from_scene_id: car_3
    to_scene_id: car_4
  - id: car_3_to_2
    from_scene_id: car_3
    to_scene_id: car_2
  - id: car_2_to_3
    from_scene_id: car_2
    to_scene_id: car_3
  - id: car_2_to_head
    from_scene_id: car_2
    to_scene_id: head_car
    required_flags: [path_through_clickers]
    required_stages: [breakthrough]
    block_reason: 你还没有安全穿过循声者所在的车厢。
  - id: head_to_2
    from_scene_id: head_car
    to_scene_id: car_2

actions:
  - id: inspect_note
    scene_id: car_6
    name: 查看便签
    kind: investigate
    once: true
    required_stages: [awake]
    effects_on_success:
      - type: set_flag
        flag: note_read
      - type: set_flag
        flag: key_hint_known

  - id: revive_attendant
    scene_id: car_4
    name: 救醒乘务员
    kind: assist
    once: true
    effects_on_success:
      - type: set_flag
        flag: attendant_revived

  - id: find_key
    scene_id: car_3
    name: 寻找钥匙
    kind: search
    once: true
    required_stages: [informed]
    conditions:
      - type: flag_set
        flag: attendant_revived
    effects_on_success:
      - type: set_flag
        flag: key_obtained

  - id: sneak_past_clickers
    scene_id: car_2
    name: 潜行通过
    kind: stealth
    once: true
    required_stages: [key_ready]
    conditions:
      - type: flag_set
        flag: key_obtained
    effects_on_success:
      - type: set_flag
        flag: path_through_clickers
    marks_scene_cleared: true

  - id: accelerate_train
    scene_id: head_car
    name: 全速前进
    kind: operate
    once: true
    required_stages: [breakthrough]
    conditions:
      - type: flag_set
        flag: key_obtained
      - type: flag_set
        flag: path_through_clickers
    effects_on_success:
      - type: set_flag
        flag: chose_accelerate

  - id: brake_train
    scene_id: head_car
    name: 拉下制动杆
    kind: operate
    once: true
    required_stages: [breakthrough]
    conditions:
      - type: flag_set
        flag: key_obtained
      - type: flag_set
        flag: path_through_clickers
    effects_on_success:
      - type: set_flag
        flag: chose_decelerate

clocks:
  - id: rear_threat
    start: 0
    max_value: 10
    step_per_turn: 1
    threshold_events:
      - value: 2
        effects:
          - type: set_flag
            flag: rear_threat_warning
      - value: 10
        effects:
          - type: set_flag
            flag: rear_threat_overwhelms

story_stages:
  - id: awake
    name: 惊醒
    description: 调查员在诡异列车中醒来。
  - id: informed
    name: 掌握线索
    description: 调查员已意识到必须继续向前并寻找钥匙。
    required_flags: [note_read]
  - id: key_ready
    name: 钥匙到手
    description: 调查员已经找到了驾驶室钥匙。
    required_flags: [key_obtained]
  - id: breakthrough
    name: 突破障碍
    description: 调查员安全穿过了循声者所在的车厢。
    required_flags: [path_through_clickers]
  - id: true_end
    name: 真结局
    description: 电车冲破噩梦般的黑暗，众人回到了现实。
    required_flags: [chose_accelerate]
    is_terminal: true
    terminal_type: success
  - id: bad_end
    name: 坏结局
    description: 列车减速后陷入黑暗，大嘴在近处咀嚼。
    is_terminal: true
    terminal_type: failure

story_transitions:
  - id: awaken_to_informed
    source_stage_id: awake
    target_stage_id: informed
    required_flags: [note_read]
    trigger_type: action_succeeded
    trigger_value: inspect_note
    priority: 10
  - id: informed_to_key_ready
    source_stage_id: informed
    target_stage_id: key_ready
    required_flags: [key_obtained]
    trigger_type: action_succeeded
    trigger_value: find_key
    priority: 10
  - id: key_ready_to_breakthrough
    source_stage_id: key_ready
    target_stage_id: breakthrough
    required_flags: [path_through_clickers]
    trigger_type: action_succeeded
    trigger_value: sneak_past_clickers
    priority: 10
  - id: breakthrough_to_true_end
    source_stage_id: breakthrough
    target_stage_id: true_end
    required_flags: [chose_accelerate]
    trigger_type: action_succeeded
    trigger_value: accelerate_train
    priority: 10
  - id: breakthrough_to_bad_end
    source_stage_id: breakthrough
    target_stage_id: bad_end
    required_flags: [chose_decelerate]
    trigger_type: action_succeeded
    trigger_value: brake_train
    priority: 20
  - id: informed_overwhelmed
    source_stage_id: informed
    target_stage_id: bad_end
    required_flags: [rear_threat_overwhelms]
    trigger_type: clock_threshold_triggered
    trigger_value: rear_threat:10
    priority: 0
  - id: key_ready_overwhelmed
    source_stage_id: key_ready
    target_stage_id: bad_end
    required_flags: [rear_threat_overwhelms]
    trigger_type: clock_threshold_triggered
    trigger_value: rear_threat:10
    priority: 0
  - id: breakthrough_overwhelmed
    source_stage_id: breakthrough
    target_stage_id: bad_end
    required_flags: [rear_threat_overwhelms]
    trigger_type: clock_threshold_triggered
    trigger_value: rear_threat:10
    priority: 0

endings:
  - id: true_end
    scene_id: head_car
    conditions:
      - type: flag_set
        flag: chose_accelerate
    result: 电车冲破噩梦般的黑暗，众人回到了现实。
  - id: bad_end
    scene_id: head_car
    conditions:
      - type: flag_set
        flag: chose_decelerate
    result: 列车减速后陷入黑暗，大嘴在近处咀嚼。
